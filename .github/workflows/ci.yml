name: CI

on:
  push:
    branches: [main, production-hardening, "m*-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r python/requirements-dev.txt
      - name: Lint
        run: python -m ruff check python
      - name: Audit dependencies
        run: python -m pip_audit -r python/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s python/tests -v

  dotnet:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore with locked versions
        run: dotnet restore csharp/AiShield.sln --locked-mode
      - name: Check formatting
        run: dotnet format csharp/AiShield.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build csharp/AiShield.sln -c Release --no-restore
      - name: Unit tests
        run: dotnet test --project csharp/AiShield.Core.Tests/AiShield.Core.Tests.csproj -c Release --no-build
      - name: Fail on vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list csharp/AiShield.sln package --vulnerable --include-transitive
          $report
          if ($report -match 'has the following vulnerable packages') { exit 1 }

  desktop-smoke:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install Python dependencies
        run: python -m pip install -r python/requirements.txt
      - name: Build
        run: dotnet build csharp/AiShield.sln -c Release
      - name: Desktop app survives with no service running
        shell: pwsh
        run: ./scripts/smoke-dashboard.ps1 -Seconds 30 -ScreenshotPath artifacts/dashboard-offline.png
      - name: Desktop app survives connected to the real service
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $service = Start-Process python -ArgumentList '-m', 'aishield' -WorkingDirectory python -PassThru `
            -RedirectStandardOutput artifacts/service.out -RedirectStandardError artifacts/service.err
          try {
            $deadline = (Get-Date).AddSeconds(60)
            do {
              Start-Sleep -Seconds 1
              if ($service.HasExited) { throw "The service exited with code $($service.ExitCode)" }
              $health = try { Invoke-RestMethod http://127.0.0.1:9470/api/health } catch { $null }
            } until ($health.ok -or (Get-Date) -gt $deadline)
            if (-not $health.ok) { throw "The service never became healthy" }
            ./scripts/smoke-dashboard.ps1 -Seconds 30 -ScreenshotPath artifacts/dashboard-online.png
            if ($service.HasExited) { throw "The service crashed during the smoke test" }
          } finally {
            if (-not $service.HasExited) { Stop-Process -Id $service.Id -Force }
          }
      - name: Keep screenshots and service logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-smoke
          path: artifacts/
          if-no-files-found: ignore

  service-integration:
    # Installs the service on an elevated runner and attacks it from a non-admin token.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Release build contains no test hooks
        shell: pwsh
        run: |
          ./scripts/ci/publish.ps1 -Configuration Release -Output release
          ./scripts/ci/assert-no-test-hooks.ps1 -Path release
      - name: Publish the CI test build
        shell: pwsh
        run: ./scripts/ci/publish.ps1 -Configuration CiTesting -Output staging
      - name: Install, attack and uninstall the service
        shell: pwsh
        run: ./scripts/ci/service-integration.ps1 -Staging staging -Artifacts artifacts
      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-integration
          path: artifacts/
          if-no-files-found: ignore

  installer:
    # Builds the MSI, then installs, upgrades, downgrades and uninstalls it on an elevated runner.
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish
        shell: pwsh
        run: |
          ./scripts/ci/publish.ps1 -Configuration Release -Output staging
          ./scripts/ci/assert-no-test-hooks.ps1 -Path staging
          dotnet publish csharp/AiShield.TamperProbe/AiShield.TamperProbe.csproj -c Release -r win-x64 -o probe -v quiet
      - name: Build an older and a newer installer
        id: versions
        shell: pwsh
        run: |
          $props = [xml](Get-Content csharp/Directory.Build.props -Raw)
          $old = [version](($props.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version)
          $new = "$($old.Major).$($old.Minor).$($old.Build + 1)"
          ./scripts/ci/build-installer.ps1 -Staging staging -Output msi -Version "$old"
          ./scripts/ci/build-installer.ps1 -Staging staging -Output msi -Version $new
          "old=$old" >> $env:GITHUB_OUTPUT
          "new=$new" >> $env:GITHUB_OUTPUT
      - name: Install, upgrade and uninstall
        shell: pwsh
        run: >
          ./scripts/ci/installer-integration.ps1
          -OldMsi msi/AiShield-${{ steps.versions.outputs.old }}.msi
          -NewMsi msi/AiShield-${{ steps.versions.outputs.new }}.msi
          -NewVersion ${{ steps.versions.outputs.new }}
          -Probe probe/AiShield.TamperProbe.exe
          -Artifacts artifacts
      - name: Keep installer logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-logs
          path: artifacts/
          if-no-files-found: ignore
      - name: Keep the unsigned test installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AiShield-unsigned-test-build
          path: msi/AiShield-${{ steps.versions.outputs.old }}.msi
          retention-days: 14

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
