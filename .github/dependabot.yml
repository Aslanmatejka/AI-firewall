version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /csharp
    schedule:
      interval: weekly
    groups:
      microsoft-extensions:
        patterns: ["Microsoft.*"]
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
